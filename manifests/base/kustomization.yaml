apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - network-policies.yaml

# Helm charts for LiteLLM, PostgreSQL and Open WebUI
helmCharts:
  # PostgreSQL for LiteLLM data and metrics storage
  - name: postgresql
    repo: https://charts.bitnami.com/bitnami
    version: 18.12.4  # Latest stable - includes PostgreSQL 16.x
    releaseName: litellm-postgres
    namespace: llm-gateway-internal
    valuesFile: postgres-chart-values.yaml

  # LiteLLM Proxy
  - name: litellm-helm
    repo: oci://ghcr.io/berriai
    version: 1.105.0
    releaseName: litellm
    namespace: llm-gateway-internal
    valuesFile: litellm-chart-values.yaml

  # Open WebUI chat interface in front of LiteLLM
  - name: open-webui
    repo: https://open-webui.github.io/helm-charts
    version: 17.0.0
    releaseName: open-webui
    namespace: llm-gateway-internal
    valuesFile: open-webui-chart-values.yaml
