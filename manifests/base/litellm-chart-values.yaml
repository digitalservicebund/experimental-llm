replicaCount: 1

image:
  repository: ghcr.io/berriai/litellm
  pullPolicy: IfNotPresent
  tag: ""  # Defaults to Chart.appVersion

service:
  type: ClusterIP
  port: 4000
  targetPort: 4000

db:
  useExisting: true
  deployStandalone: false
  endpoint: litellm-postgres-postgresql
  database: litellm
  secret:
    name: litellm-db-credentials
    usernameKey: username
    passwordKey: password

masterkeySecretName: litellm-secrets
masterkeySecretKey: master-key

migrationJob:
  hooks:
    argocd:
      enabled: false
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 2Gi

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault

envVars:
  VLLM_API_BASE: "http://localhost:8000/v1"

proxy_config:
  litellm_settings:
    log_level: INFO
    debug: false
    pass_through_error_codes:
      - 429
      - 500
      - 502
      - 503
      - 504
    enable_logging: true
    log_response_per_token: true
  router_settings:
    default_max_retries: 3
    default_timeout: 600
  model_list:
    - model_name: qwen-coder
      litellm_params:
        model: openai/qwen-coder-32b
        api_base: ${VLLM_API_BASE}
        api_key: sk-1234
        api_version: "2024-01-01"

livenessProbe:
  httpGet:
    path: /health
    port: 4000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 4000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

pdb:
  enabled: true
  maxUnavailable: 1

# Labels for billing and identification
labels:
  app.kubernetes.io/name: litellm
  app.kubernetes.io/instance: staging
  digitalservice.dev/project: internal
