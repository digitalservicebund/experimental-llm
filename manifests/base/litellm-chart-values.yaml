replicaCount: 1

image:
  repository: ghcr.io/berriai/litellm
  pullPolicy: IfNotPresent
  tag: ""  # Defaults to Chart.appVersion

service:
  type: ClusterIP
  port: 4000
  targetPort: 4000

db:
  useExisting: true
  deployStandalone: false
  endpoint: litellm-postgres-postgresql
  database: litellm
  secret:
    name: litellm-db-credentials
    usernameKey: username
    passwordKey: password

masterkeySecretName: litellm-secrets
masterkeySecretKey: master-key

migrationJob:
  hooks:
    argocd:
      enabled: false
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

resources:
  requests:
    cpu: 10m
    memory: 683Mi
  limits:
    memory: 1616Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# Vertex AI authenticates this ServiceAccount via Workload Identity Federation
# (see docs/vertex-ai.md). The GCP principal is bound to its name.
serviceAccount:
  create: true
  name: litellm

# The chart already mounts a writable emptyDir at /tmp because of
# readOnlyRootFilesystem.
volumes:
  - name: gcp-workload-identity
    projected:
      sources:
        - serviceAccountToken:
            path: token
            audience: https://iam.googleapis.com/projects/530198116931/locations/global/workloadIdentityPools/stackit-ske/providers/llm-gateway
            expirationSeconds: 3600
        - configMap:
            name: litellm-gcp-workload-identity
            items:
              - key: credential-configuration.json
                path: credential-configuration.json

volumeMounts:
  - name: gcp-workload-identity
    mountPath: /var/run/secrets/gcp
    readOnly: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

envVars:
  HOME: "/tmp"
  XDG_CONFIG_HOME: "/tmp/.config"
  VERTEXAI_PROJECT: "internal-llm-513109"
  GOOGLE_APPLICATION_CREDENTIALS: "/var/run/secrets/gcp/credential-configuration.json"

proxy_config:
  litellm_settings:
    log_level: INFO
    debug: false
    pass_through_error_codes:
      - 429
      - 500
      - 502
      - 503
      - 504
    enable_logging: true
    log_response_per_token: true
    # Budget of every end user without an own budget; create it once (see README)
    max_end_user_budget_id: open-webui-user
  # The chart's master_key stays, Helm merges this map with the chart defaults
  general_settings:
    # Open WebUI sends the signed-in user's email (ENABLE_FORWARD_USER_INFO_HEADERS)
    user_header_mappings:
      - header_name: X-OpenWebUI-User-Email
        litellm_user_role: customer
  router_settings:
    default_max_retries: 3
    default_timeout: 600
  model_list:
    - model_name: gemini-4-argon
      litellm_params:
        model: vertex_ai/gemini-4-argon
        vertex_project: os.environ/VERTEXAI_PROJECT
        vertex_location: eu
    - model_name: gemini-3.6-flash
      litellm_params:
        model: vertex_ai/gemini-3.6-flash
        vertex_project: os.environ/VERTEXAI_PROJECT
        vertex_location: eu
    # Open WebUI embeds documents with this model (RAG_EMBEDDING_MODEL)
    - model_name: gemini-embedding-2
      litellm_params:
        model: vertex_ai/gemini-embedding-2
        vertex_project: os.environ/VERTEXAI_PROJECT
        vertex_location: eu
      model_info:
        mode: embedding
  # Claude models need to be enabled in Model Garden first.
  #  - model_name: claude-opus-5-5
  #    litellm_params:
  #      model: vertex_ai/claude-opus-5-5
  #      vertex_project: os.environ/VERTEXAI_PROJECT
  #      vertex_location: eu
  #  - model_name: claude-sonnet-5-5
  #    litellm_params:
  #      model: vertex_ai/claude-sonnet-5-5
  #      vertex_project: os.environ/VERTEXAI_PROJECT
  #      vertex_location: eu
  #  - model_name: claude-haiku-5-5
  #    litellm_params:
  #      model: vertex_ai/claude-haiku-5-5
  #      vertex_project: os.environ/VERTEXAI_PROJECT
  #      vertex_location: eu

livenessProbe:
  httpGet:
    path: /health
    port: 4000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 4000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

pdb:
  enabled: false

# Labels for billing and identification
labels:
  app.kubernetes.io/name: litellm
  app.kubernetes.io/instance: staging
  digitalservice.dev/project: internal
