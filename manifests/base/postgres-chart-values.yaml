auth:
  database: litellm
  username: litellm
  existingSecret: litellm-postgres-auth
  secretKeys:
    adminPasswordKey: postgres-password
    userPasswordKey: password

# Override images to use whitelisted alternatives
image:
  registry: docker.io
  repository: postgres
  tag: "16"

volumePermissions:
  enabled: false
  image:
    registry: docker.io
    repository: bitnamilegacy/os-shell
    tag: "12-debian-12-r16"

primary:
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: csi-sc-fast

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

  podSecurityContext:
    enabled: true
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    enabled: true
    runAsUser: 1001
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  extraVolumeMounts:
    - name: run-postgresql
      mountPath: /var/run/postgresql

  # Extra volumes for /var/run/postgresql (tmpfs)
  extraVolumes:
    - name: run-postgresql
      emptyDir:
        medium: Memory
        sizeLimit: 128Mi

readReplicas:
  enabled: false

metrics:
  enabled: false

backup:
  enabled: false

# Labels for billing and identification
labels:
  app.kubernetes.io/name: litellm-postgres
  app.kubernetes.io/instance: staging
  digitalservice.dev/project: internal
