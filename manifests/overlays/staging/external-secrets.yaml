# External Secrets Configuration for LiteLLM
#
# These resources should be created to fetch secrets from STACKIT Secrets Manager
# This file is a TEMPLATE and should be configured with your actual secret references
#
# Prerequisites:
# 1. A SecretStore must exist in the namespace (see external-secrets.md)
# 2. Secrets must be created in STACKIT Secrets Manager with the exact names referenced below

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-db-credentials
  namespace: llm-gateway-internal
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: "15m"
  secretStoreRef:
    name: secret-store
    kind: SecretStore
  target:
    name: litellm-db-credentials
    creationPolicy: None
    template:
      engineVersion: v2
      data:
        username: "litellm"
        password: "{{ .db_password }}"
        connection-string: "postgresql://litellm:{{ .db_password }}@litellm-postgres-postgresql:5432/litellm"
  data:
    - secretKey: db_password
      remoteRef:
        key: litellm-db-password
        property: value

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-postgres-auth
  namespace: llm-gateway-internal
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: "15m"
  secretStoreRef:
    name: secret-store
    kind: SecretStore
  target:
    name: litellm-postgres-auth
    creationPolicy: None
  data:
    - secretKey: password
      remoteRef:
        key: litellm-db-password
        property: value
    - secretKey: postgres-password
      remoteRef:
        key: litellm-db-password
        property: value

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secrets
  namespace: llm-gateway-internal
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: "15m"
  secretStoreRef:
    name: secret-store
    kind: SecretStore
  target:
    name: litellm-secrets
    creationPolicy: None
  data:
    - secretKey: master-key
      remoteRef:
        key: litellm-master-key
        property: value

