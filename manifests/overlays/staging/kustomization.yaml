apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace for the internal application
namespace: llm-gateway-internal


# Resources from base (if any)
resources:
  - ../../base
  - secret-store.yaml
  - external-secrets.yaml

# Helm charts for LiteLLM and PostgreSQL
helmCharts:
  # PostgreSQL for LiteLLM data and metrics storage
  - name: postgresql
    repo: https://charts.bitnami.com/bitnami
    version: 18.12.4  # Latest stable - includes PostgreSQL 16.x
    releaseName: litellm-postgres
    namespace: llm-gateway-internal
    valuesFile: ../../base/postgres-chart-values.yaml
    valuesInline:
      auth:
        existingSecret: litellm-postgres-auth
        secretKeys:
          adminPasswordKey: postgres-password
          userPasswordKey: password
      primary:
        persistence:
          size: 10Gi
      # Labels for billing and identification
      labels:
        app.kubernetes.io/name: litellm-postgres
        app.kubernetes.io/instance: staging
        digitalservice.dev/project: internal

  # LiteLLM Proxy
  - name: litellm-helm
    repo: oci://ghcr.io/berriai
    version: 1.103.0  # Latest stable from ArtifactHub
    releaseName: litellm
    namespace: llm-gateway-internal
    valuesFile: ../../base/litellm-chart-values.yaml
    valuesInline:
      replicaCount: 1
      service:
        type: ClusterIP
        port: 4000
      proxy_config:
        litellm_settings:
          log_level: INFO
          debug: false
          pass_through_error_codes:
            - 429
            - 500
            - 502
            - 503
            - 504
          enable_logging: true
          log_response_per_token: true
        router_settings:
          default_max_retries: 3
          default_timeout: 600
        model_list:
          - model_name: qwen-coder
            litellm_params:
              model: openai/qwen-coder-32b
              api_base: ${VLLM_API_BASE}
              api_key: sk-1234
              api_version: "2024-01-01"
      # Labels for billing and identification
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/instance: staging
        digitalservice.dev/project: internal
      # Database connection (via External Secret)
      env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: litellm-db-credentials
              key: connection-string
        - name: MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secrets
              key: master-key
        - name: VLLM_API_BASE
          value: "http://localhost:8000/v1"  # Configure for your vLLM instance

