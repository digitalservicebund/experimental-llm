name: Validate Ansible

on:
  pull_request:
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-validate.yml"
  push:
    branches:
      - main
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Syntax and lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ansible

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Ansible tooling
        run: python -m pip install --upgrade ansible-core ansible-lint yamllint

      - name: Run Ansible lint suite
        run: ./lint.sh