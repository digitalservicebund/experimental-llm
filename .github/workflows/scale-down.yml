name: Scale Down

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions schedules are UTC.
    # 20:00 CEST (summer)
    - cron: "0 18 * 4-10 1-5"
    # 20:00 CET (winter)
    - cron: "0 19 * 1-3,11-12 1-5"

permissions:
  contents: read
  id-token: write

jobs:
  destroy-vm:
    name: Destroy VM via Terraform apply
    uses: ./.github/workflows/terraform-apply.yml
    with:
      project_id: "8f43ea04-9012-4cd7-8d14-d4e202c9ddc0"
      existing_network_id: "7cdd4ee0-cb53-40b7-b8e8-50a324c261f8"
      vm_enabled: "false"
      bootstrap_ssh_public_key: ""
    secrets: inherit

