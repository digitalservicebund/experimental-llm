name: Terraform

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: true

jobs:
  fmt:
    name: Terraform format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Terraform
        uses: digitalservicebund/setup-terraform@400976bd246bef1e51fe73695fe7658ce484bc43

      - name: Check terraform fmt
        run: terraform fmt -recursive -check terraform

  validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    needs: fmt

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Terraform
        uses: digitalservicebund/setup-terraform@400976bd246bef1e51fe73695fe7658ce484bc43

      - name: Initialize Terraform without backend
        run: terraform -chdir=terraform/non-prod init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform -chdir=terraform/non-prod validate

