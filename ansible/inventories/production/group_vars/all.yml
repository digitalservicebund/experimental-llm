---
llm_gpu_vendor: nvidia

# Ensure package installation has working route and DNS on Ubuntu hosts.
common_netplan_manage: true
common_netplan_file: /etc/netplan/99-ansible.yaml
common_net_iface: enp3s0
common_net_dhcp4: true
common_net_addresses: []
common_net_gateway4: ""
common_net_dns_servers:
  - 1.1.1.1
  - 8.8.8.8

# AWQ int4 (~19 GiB) so the 32B fits the single 45 GiB L40S; bf16 needs ~64 GiB.
llm_model: Qwen/Qwen2.5-Coder-32B-Instruct-AWQ
llm_host_port: 8000
llm_service_user: vllm
llm_model_cache_dir: /var/lib/vllm/model-cache
llm_virtualenv: /opt/vllm/venv

# Delete cached model repos other than llm_model, so switching models does not
# silently leave tens of GB behind.
llm_prune_old_models: true

# Pin this after validating the NVIDIA driver and Python environment.
vllm_version: "v0.29.0"
# Must match the CUDA major version vLLM's wheels are built against (13), or
# torch pulls a cu12 stack and vllm._C_stable_libtorch fails on libcudart.so.13.
vllm_torch_index: https://download.pytorch.org/whl/cu130

# Target 64k context for this trial; YaRN is injected via vLLM hf-overrides.
llm_max_model_len: 65536
llm_tensor_parallel_size: 1
llm_gpu_memory_utilization: 0.90

# Keep the vLLM API bound to the host. It's accessed only by LiteLLM proxy on localhost.
llm_api_host: 127.0.0.1

# The workstation secret wrapper provides this only for the duration of a run.
# Leave HF_TOKEN unset for public model repositories.
llm_huggingface_token: "{{ lookup('ansible.builtin.env', 'HF_TOKEN') }}"

# LiteLLM Proxy Configuration
# Master key for securing the /key/generate endpoint (generate Virtual Keys post-deployment)
litellm_master_key: "{{ lookup('ansible.builtin.env', 'LLM_MASTER_KEY') }}"

# PostgreSQL Configuration for LiteLLM
# Database password for the litellm user (used by LiteLLM proxy for metrics, spend logs, key storage)
postgresql_litellm_password: "{{ lookup('ansible.builtin.env', 'POSTGRESQL_PASSWORD') }}"
