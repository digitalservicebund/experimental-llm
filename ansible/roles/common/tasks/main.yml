---
- name: Install Python and base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - build-essential
      - python3
      - python3-venv
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable unattended security updates
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Enable unattended upgrades service
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    enabled: true
    state: started
