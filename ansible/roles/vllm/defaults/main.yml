---
# Package set for Ubuntu NVIDIA GPU hosts, pinned to a validated branch.
vllm_nvidia_driver_packages:
  - nvidia-driver-595-server
  - nvidia-utils-595-server

# Reboot automatically when the driver package changes.
vllm_nvidia_auto_reboot: true

# Local destination for the vendored Qwen2.5-Coder parser assets.
llm_tool_parser_assets_dir: /opt/vllm/tool-parser-assets
