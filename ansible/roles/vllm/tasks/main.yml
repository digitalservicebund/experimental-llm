---
- name: Install NVIDIA driver helper tools
  ansible.builtin.apt:
    name: ubuntu-drivers-common
    state: present
    lock_timeout: 120
  when: llm_gpu_vendor | lower == 'nvidia'

- name: Install NVIDIA driver packages
  ansible.builtin.apt:
    name: "{{ vllm_nvidia_driver_packages }}"
    state: present
    lock_timeout: 120
  when: llm_gpu_vendor | lower == 'nvidia'

- name: Check whether reboot is required after driver install
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: vllm_reboot_required
  changed_when: false
  when: llm_gpu_vendor | lower == 'nvidia'

- name: Reboot host when pending reboot is detected
  ansible.builtin.reboot:
    msg: Reboot initiated by Ansible to activate NVIDIA kernel modules.
    reboot_timeout: 1800
  when:
    - llm_gpu_vendor | lower == 'nvidia'
    - vllm_nvidia_auto_reboot | bool
    - vllm_reboot_required.stat.exists

- name: Fail when reboot is required but auto reboot is disabled
  ansible.builtin.fail:
    msg: >-
      NVIDIA packages are installed but a reboot is required to activate the
      kernel driver. Reboot the host, or set vllm_nvidia_auto_reboot=true.
  when:
    - llm_gpu_vendor | lower == 'nvidia'
    - not (vllm_nvidia_auto_reboot | bool)
    - vllm_reboot_required.stat.exists

- name: Refresh facts after potential reboot
  ansible.builtin.setup:
  when: llm_gpu_vendor | lower == 'nvidia'

- name: Check whether nvidia-smi is available
  ansible.builtin.command: which nvidia-smi
  register: vllm_nvidia_smi_path
  changed_when: false
  failed_when: false
  when: llm_gpu_vendor | lower == 'nvidia'

- name: Fail when NVIDIA driver tooling is missing
  ansible.builtin.fail:
    msg: >-
      NVIDIA GPU support is enabled (llm_gpu_vendor=nvidia), but nvidia-smi was
      not found on the host. Install the NVIDIA driver stack and rerun the playbook.
  when:
    - llm_gpu_vendor | lower == 'nvidia'
    - vllm_nvidia_smi_path.rc != 0

- name: Query NVIDIA driver and GPU visibility
  ansible.builtin.command: >-
    nvidia-smi --query-gpu=driver_version,memory.total --format=csv,noheader
  register: vllm_nvidia_smi
  changed_when: false
  check_mode: false
  failed_when: false
  when: llm_gpu_vendor | lower == 'nvidia'

- name: Fail when NVIDIA driver is not active
  ansible.builtin.fail:
    msg: >-
      nvidia-smi is present but cannot talk to the NVIDIA driver (rc={{ vllm_nvidia_smi.rc }}).
      Ensure the correct NVIDIA driver is installed and loaded (for example
      nvidia-driver-595-server), then reboot the host and rerun this playbook.
  when:
    - llm_gpu_vendor | lower == 'nvidia'
    - vllm_nvidia_smi.rc != 0

- name: Install vLLM Python package in an isolated virtual environment
  ansible.builtin.pip:
    name: "vllm=={{ vllm_version }}"
    virtualenv: "{{ llm_virtualenv }}"
    virtualenv_command: python3 -m venv
    extra_args: "--extra-index-url {{ vllm_torch_index }}"
    state: present
  notify: Restart vLLM

- name: Create vLLM service account
  ansible.builtin.user:
    name: "{{ llm_service_user }}"
    system: true
    home: /var/lib/vllm
    create_home: true
    shell: /usr/sbin/nologin

- name: Create model cache directory
  ansible.builtin.file:
    path: "{{ llm_model_cache_dir }}"
    state: directory
    owner: "{{ llm_service_user }}"
    group: "{{ llm_service_user }}"
    mode: "0750"

- name: Find cached model repositories
  ansible.builtin.find:
    paths: "{{ llm_model_cache_dir }}/hub"
    patterns: "models--*"
    file_type: directory
    recurse: false
  register: vllm_cached_models
  changed_when: false
  when: llm_prune_old_models | bool

- name: Remove cached models that are no longer served
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ vllm_cached_models.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when:
    - llm_prune_old_models | bool
    - item.path | basename != 'models--' ~ (llm_model | replace('/', '--'))

- name: Resolve the virtualenv site-packages path
  ansible.builtin.command: >-
    {{ llm_virtualenv }}/bin/python3 -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])'
  register: vllm_site_packages
  changed_when: false

- name: Write vLLM environment file
  ansible.builtin.template:
    src: vllm.env.j2
    dest: /etc/vllm.env
    owner: root
    group: root
    mode: "0600"
  notify: Restart vLLM

- name: Install vLLM systemd service
  ansible.builtin.template:
    src: vllm.service.j2
    dest: /etc/systemd/system/vllm.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart vLLM

- name: Enable vLLM
  ansible.builtin.systemd_service:
    name: vllm
    enabled: true
    state: started
    daemon_reload: true

- name: Flush handlers before health check
  ansible.builtin.meta: flush_handlers

- name: Check vLLM health endpoint
  ansible.builtin.uri:
    url: >-
      http://{{ '127.0.0.1' if llm_api_host in ['0.0.0.0', '::'] else llm_api_host }}:{{ llm_host_port }}/health
    method: GET
    status_code: 200
    use_proxy: false
  register: vllm_health_check
  retries: 60
  delay: 2
  until: vllm_health_check.status == 200
  changed_when: false
