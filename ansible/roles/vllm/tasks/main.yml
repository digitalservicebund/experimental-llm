---
- name: Verify NVIDIA driver and GPU visibility
  ansible.builtin.command: >-
    nvidia-smi --query-gpu=driver_version,memory.total --format=csv,noheader
  register: vllm_nvidia_smi
  changed_when: false
  check_mode: false

- name: Install vLLM Python package in an isolated virtual environment
  ansible.builtin.pip:
    name: "vllm=={{ vllm_version }}"
    virtualenv: "{{ llm_virtualenv }}"
    virtualenv_command: python3 -m venv
    extra_args: "--extra-index-url {{ vllm_torch_index }}"
    state: present
  notify: Restart vLLM

- name: Create vLLM service account
  ansible.builtin.user:
    name: "{{ llm_service_user }}"
    system: true
    home: /var/lib/vllm
    create_home: true
    shell: /usr/sbin/nologin

- name: Create model cache directory
  ansible.builtin.file:
    path: "{{ llm_model_cache_dir }}"
    state: directory
    owner: "{{ llm_service_user }}"
    group: "{{ llm_service_user }}"
    mode: "0750"

- name: Write vLLM environment file
  ansible.builtin.template:
    src: vllm.env.j2
    dest: /etc/vllm.env
    owner: root
    group: root
    mode: "0600"
  notify: Restart vLLM

- name: Install vLLM systemd service
  ansible.builtin.template:
    src: vllm.service.j2
    dest: /etc/systemd/system/vllm.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart vLLM

- name: Enable vLLM
  ansible.builtin.systemd_service:
    name: vllm
    enabled: true
    state: started
    daemon_reload: true
